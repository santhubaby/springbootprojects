server:
  port: 8083

spring:
  application:
    name: ordergatewayservice

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: api-1
              uri: lb://orderservice
              predicates:
                - Path=/orders/**
            - id: api-2
              uri: lb://greet
              predicates:
                - Path=/greet

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: gateway,health,info
